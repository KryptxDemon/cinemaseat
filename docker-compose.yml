services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cinemaseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinemaseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    ports:
      - "8080:8080"
    environment:
      # Adjust to point at your real backend when it exists.
      - BACKEND_URL=http://host.docker.internal:8000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./bdn
      dockerfile: Dockerfile
      args:
        # Browser-side base URL for the FastAPI gateway. Baked into
        # the JS bundle at build time (Vite inlines import.meta.env).
        VITE_API_URL: http://localhost:8080
    image: cinemaseat/frontend:latest
    container_name: cinemaseat-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
