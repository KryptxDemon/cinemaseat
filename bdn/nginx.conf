worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # Reasonable compression for text-based assets.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Long-cache hashed Vite assets, no-cache for everything else (SPA).
    map $uri $cache_control {
        ~*\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    # Backend API — resolved by Docker DNS on the compose network.
    upstream cinemaseat_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Security headers — light touch; backend handles auth/CORS.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 16m;

        location / {
            add_header Cache-Control $cache_control;
            try_files $uri $uri/ /index.html;
        }

        # Reverse-proxy every API request to the FastAPI backend in-cluster.
        # Browsers always hit this nginx (same-origin, no CORS); the `/api`
        # prefix is stripped so the backend sees `/movies`, `/holds`, etc.
        location /api/ {
            proxy_pass         http://cinemaseat_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # Don't cache the SPA shell — index.html must always be revalidated
        # so deploys are picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires 0;
        }

        # Lightweight health endpoint for orchestrators.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
