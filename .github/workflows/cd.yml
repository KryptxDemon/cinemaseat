# CinemaSeat — Continuous Delivery.
#
# Builds and publishes the backend Docker image to Docker Hub after CI
# succeeds on the `main` branch.
#
# Flow:
#   Push to main
#     -> CI workflow runs (backend CI: .github/workflows/ci.yml)
#     -> this workflow is triggered by `workflow_run` ONLY if CI succeeded
#     -> docker login
#     -> docker build (the existing backend/Dockerfile is reused as-is)
#     -> docker tag -> latest and <commit-sha>
#     -> docker push both tags
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account that owns the target repo
#   DOCKERHUB_TOKEN     — Docker Hub access token (NOT the account password)
#
# Required GitHub repository variable (optional, falls back to secret):
#   DOCKERHUB_REPO      — image repo name (defaults to "cinemaseat-backend")

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow manual trigger from the Actions tab for emergency re-publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Only publish after a successful CI run on main.
    # - `workflow_run` with `conclusion == success` guarantees CI passed.
    # - Manual `workflow_dispatch` always runs (operator's responsibility).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can resolve the triggering commit SHA,
          # even on workflow_run where the default SHA is the workflow run.
          fetch-depth: 0

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          DOCKERHUB_REPO_DEFAULT: cinemaseat-backend
        run: |
          set -euo pipefail

          # Commit SHA of the push that triggered CI.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          # Short SHA tag, e.g. a81f42c.
          SHORT_SHA="${SHA::7}"

          # Image repo name (allow override via repo variable).
          REPO="${DOCKERHUB_REPO:-$DOCKERHUB_REPO_DEFAULT}"

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "repo=${REPO}"
            echo "branch=${GITHUB_REF_NAME:-main}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        # The existing backend/Dockerfile is reused as-is. We point the
        # build context at ./backend so paths inside the Dockerfile
        # (COPY app ./app, etc.) resolve correctly.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}

      - name: Tag image as :latest
        shell: bash
        run: |
          set -euo pipefail
          docker tag \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.short_sha }}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}:latest"

      - name: Push image tags to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.short_sha }}"
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}:latest"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### CD pipeline result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.repo }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`:latest\`, \`:${{ steps.meta.outputs.short_sha }}\` (full \`${{ steps.meta.outputs.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ steps.meta.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: \`${{ steps.meta.outputs.timestamp }}\`" >> "$GITHUB_STEP_SUMMARY"