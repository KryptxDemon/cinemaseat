name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./bdn
          file: ./bdn/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/cinemaseat/frontend:${{ github.sha }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/cinemaseat/backend:${{ github.sha }}

  deploy:
    name: Deploy stack
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Pull + up
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          SHA: ${{ github.sha }}
        run: |
            export FRONTEND_IMAGE=${REGISTRY}/cinemaseat/frontend:${SHA}
            export BACKEND_IMAGE=${REGISTRY}/cinemaseat/backend:${SHA}
            docker compose -f devops/docker-compose.yml pull
            docker compose -f devops/docker-compose.yml up -d