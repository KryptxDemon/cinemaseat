# Frontend-only slice of the integration stack.
#
# This file is owned by the `frontend` branch. The full integration
# stack (postgres + backend + gateway + frontend) lives on the
# `devops` branch in devops/docker-compose.yml. See BRANCHES.md.
#
# Usage:
#   docker compose -f frontend.docker-compose.yml up

services:
  frontend:
    build:
      context: ./bdn
      dockerfile: Dockerfile
      args:
        # Browser-side base URL for the FastAPI gateway. Baked into
        # the JS bundle at build time (Vite inlines import.meta.env).
        VITE_API_URL: http://localhost:8080
    image: cinemaseat/frontend:latest
    container_name: cinemaseat-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
