# Alembic configuration for CinemaSeat.
#
# The actual database URL is wired up in env.py, which pulls it from
# the Pydantic Settings object (i.e. environment / .env). The
# `sqlalchemy.url` line below is intentionally blank so that
# misconfigured deployments fail loudly rather than silently writing
# to the wrong database.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S