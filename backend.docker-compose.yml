# Backend-only slice of the integration stack.
#
# This file is owned by the `backend` branch. The full integration
# stack (postgres + backend + gateway + frontend) lives on the
# `devops` branch in devops/docker-compose.yml. See BRANCHES.md.
#
# Usage:
#   docker compose -f backend.docker-compose.yml up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cinemaseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinemaseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cinemaseat/backend:latest
    container_name: cinemaseat-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cinemaseat
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)\""]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data: